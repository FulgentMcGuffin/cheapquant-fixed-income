[project]
name = "cqfi"
version = "0.1.0"
description = "Interactive agent for QuantLib fixed-income analytics on government bonds."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "QuantLib>=1.36",
    "duckdb>=1.5.0",
    "framecache",
    "mcp-data",
    "polars>=1.41.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "plotnine>=0.15.7",
    "pyside6>=6.11.1",
    "anthropic>=0.112.0",
    "decorules",
]

[project.scripts]
cqfi     = "cqfi.agent.cli:main"
cqfi-gui = "cqfi.gui.app:main"
batch-bond-analytics = "cqfi.batch.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqfi"]

[tool.uv.sources]
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
decorules = { git = "https://github.com/FulgentMcGuffin/decorules.git" }
mcp-data = { git = "https://github.com/FulgentMcGuffin/mcp_data.git" }

[tool.uv]
override-dependencies = [
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_eval: exercises the real Anthropic API end-to-end (costs money, needs ANTHROPIC_API_KEY); run explicitly with -m llm_eval",
    "asyncio: mark test as async",
]
